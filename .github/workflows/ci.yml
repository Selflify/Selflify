name: CI

on:
  pull_request:
    branches:
      - stable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate GitHub workflows
        run: yarn workflow:lint

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:run

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Validate production compose
        run: docker compose config
