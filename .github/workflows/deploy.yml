name: Deploy

on:
  push:
    branches:
      - stable
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:run

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Validate production compose
        run: docker compose config

  deploy:
    needs: repo-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      SELFLIFY_DOMAIN: ${{ vars.SELFLIFY_DOMAIN }}
      SELFLIFY_SERVER_IP: ${{ vars.SELFLIFY_SERVER_IP }}
      SELFLIFY_CADDY_EMAIL: ${{ vars.SELFLIFY_CADDY_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          for required in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY AUTH_SECRET; do
            if [ -z "${!required:-}" ]; then
              echo "Missing required GitHub variable/secret: ${required}" >&2
              exit 1
            fi
          done

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add SSH known hosts
        shell: bash
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Prepare remote directory
        shell: bash
        run: |
          set -euo pipefail

          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DEPLOY_PATH}'"

      - name: Sync repository to server
        shell: bash
        run: |
          set -euo pipefail

          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'coverage/' \
            --exclude '.dev/' \
            --exclude '.selflify/' \
            --exclude '.env' \
            --exclude 'selflify.config.json' \
            --exclude 'Caddyfile' \
            --exclude 'data/' \
            --exclude 'config/' \
            --exclude 'logs/' \
            --exclude 'sites.json' \
            -e "ssh -p ${DEPLOY_PORT:-22}" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Upload production env
        shell: bash
        env:
          SELFLIFY_PREVIEW_TTL_DAYS: ${{ vars.SELFLIFY_PREVIEW_TTL_DAYS }}
          SELFLIFY_ORPHAN_TTL_DAYS: ${{ vars.SELFLIFY_ORPHAN_TTL_DAYS }}
          SELFLIFY_CLEANUP_INTERVAL_SECONDS: ${{ vars.SELFLIFY_CLEANUP_INTERVAL_SECONDS }}
          SELFLIFY_BACKUP_KEEP: ${{ vars.SELFLIFY_BACKUP_KEEP }}
        run: |
          set -euo pipefail

          cat <<EOF > .env.production
          AUTH_SECRET=${AUTH_SECRET}
          SELFLIFY_PREVIEW_TTL_DAYS=${SELFLIFY_PREVIEW_TTL_DAYS}
          SELFLIFY_ORPHAN_TTL_DAYS=${SELFLIFY_ORPHAN_TTL_DAYS}
          SELFLIFY_CLEANUP_INTERVAL_SECONDS=${SELFLIFY_CLEANUP_INTERVAL_SECONDS}
          SELFLIFY_BACKUP_KEEP=${SELFLIFY_BACKUP_KEEP}
          EOF

          scp -P "${DEPLOY_PORT:-22}" .env.production "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.env"

      - name: Deploy on server
        shell: bash
        run: |
          set -euo pipefail

          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" <<EOF
          set -euo pipefail
          cd "${DEPLOY_PATH}"

          mkdir -p data config logs

          if [ ! -f selflify.config.json ]; then
            if [ -z "${SELFLIFY_DOMAIN:-}" ] || [ -z "${SELFLIFY_SERVER_IP:-}" ]; then
              echo "selflify.config.json is missing and SELFLIFY_DOMAIN / SELFLIFY_SERVER_IP are not configured in GitHub vars." >&2
              exit 1
            fi

            if [ ! -f bootstrap/selflify.config.template.json ]; then
              echo "bootstrap/selflify.config.template.json is missing in the deployed project." >&2
              exit 1
            fi

            CADDY_EMAIL="${SELFLIFY_CADDY_EMAIL:-admin@${SELFLIFY_DOMAIN}}"

            python3 - <<'PY' bootstrap/selflify.config.template.json selflify.config.json "${SELFLIFY_DOMAIN}" "${SELFLIFY_SERVER_IP}" "${CADDY_EMAIL}" "${AUTH_SECRET}"
from pathlib import Path
import sys

template_path = Path(sys.argv[1])
output_path = Path(sys.argv[2])
domain = sys.argv[3]
server_ip = sys.argv[4]
caddy_email = sys.argv[5]
auth_secret = sys.argv[6]

payload = template_path.read_text("utf-8")
payload = payload.replace("__SELFLIFY_DOMAIN__", domain)
payload = payload.replace("__SELFLIFY_SERVER_IP__", server_ip)
payload = payload.replace("__SELFLIFY_CADDY_EMAIL__", caddy_email)
payload = payload.replace("__SELFLIFY_SESSION_SECRET__", auth_secret)
output_path.write_text(payload, encoding="utf-8")
PY

            echo "Seeded selflify.config.json from bootstrap template."
          fi

          if [ ! -f Caddyfile ]; then
            if [ -z "${SELFLIFY_DOMAIN:-}" ]; then
              echo "Caddyfile is missing and SELFLIFY_DOMAIN is not configured in GitHub vars." >&2
              exit 1
            fi

            if [ ! -f bootstrap/Caddyfile.template ]; then
              echo "bootstrap/Caddyfile.template is missing in the deployed project." >&2
              exit 1
            fi

            CADDY_EMAIL="${SELFLIFY_CADDY_EMAIL:-admin@${SELFLIFY_DOMAIN}}"

            python3 - <<'PY' bootstrap/Caddyfile.template Caddyfile "${SELFLIFY_DOMAIN}" "${CADDY_EMAIL}"
from pathlib import Path
import sys

template_path = Path(sys.argv[1])
output_path = Path(sys.argv[2])
domain = sys.argv[3]
caddy_email = sys.argv[4]

payload = template_path.read_text("utf-8")
payload = payload.replace("__SELFLIFY_DOMAIN__", domain)
payload = payload.replace("__SELFLIFY_CADDY_EMAIL__", caddy_email)
output_path.write_text(payload, encoding="utf-8")
PY

            echo "Seeded Caddyfile from bootstrap template."
          fi

          docker compose up -d --build --remove-orphans
          docker compose ps
          EOF
