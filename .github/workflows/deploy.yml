name: Deploy

on:
  push:
    branches:
      - stable
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate GitHub workflows
        run: yarn workflow:lint

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:run

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Validate production compose
        run: docker compose config

  build-images:
    needs: repo-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push selflify image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/selflify/Dockerfile
          target: runner
          push: true
          provenance: false
          tags: |
            ghcr.io/selflify/selflify:stable
            ghcr.io/selflify/selflify:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Selflify/Selflify
            org.opencontainers.image.description=Selflify admin panel runtime image
          cache-from: type=gha,scope=selflify-runner
          cache-to: type=gha,mode=max,scope=selflify-runner

      - name: Build and push cleanup image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/selflify/Dockerfile
          target: cleanup
          push: true
          provenance: false
          tags: |
            ghcr.io/selflify/selflify-cleanup:stable
            ghcr.io/selflify/selflify-cleanup:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Selflify/Selflify
            org.opencontainers.image.description=Selflify cleanup worker image
          cache-from: type=gha,scope=selflify-cleanup
          cache-to: type=gha,mode=max,scope=selflify-cleanup

      - name: Build and push caddy image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/caddy/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/selflify/selflify-caddy:stable
            ghcr.io/selflify/selflify-caddy:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Selflify/Selflify
            org.opencontainers.image.description=Selflify Caddy runtime image
          cache-from: type=gha,scope=selflify-caddy
          cache-to: type=gha,mode=max,scope=selflify-caddy

  publish-bootstrap:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build bootstrap bundle
        run: yarn bootstrap:bundle

      - name: Publish latest bootstrap release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bootstrap-latest
          name: Bootstrap latest
          body: Latest Selflify bootstrap assets built from the stable branch.
          make_latest: true
          files: |
            dist/bootstrap/install-selflify.sh
            dist/bootstrap/selflify-bootstrap.tar.gz

  bootstrap-e2e:
    needs: publish-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browser
        run: yarn exec playwright install --with-deps chromium

      - name: Log in to GHCR for bootstrap smoke
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap Selflify from the latest release
        env:
          SELFLIFY_MOCK_CLOUDFLARE: "1"
        run: curl -fsSL https://github.com/Selflify/Selflify/releases/latest/download/install-selflify.sh | bash

      - name: Wait for /setup
        run: |
          set -euo pipefail

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/setup >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "Selflify /setup did not become reachable in time." >&2
          docker ps >&2 || true
          exit 1

      - name: Run bootstrap e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1
          E2E_SETUP_LOGIN: owner
          E2E_SETUP_PASSWORD: supersecret123
          E2E_PRIMARY_DOMAIN: example.dev
          E2E_SERVER_IP: 127.0.0.1
          E2E_CADDY_CONTACT_EMAIL: ops@example.dev
          E2E_CLOUDFLARE_API_TOKEN: cf-token-for-e2e
        run: yarn e2e:bootstrap-install

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-e2e-playwright
          path: output/playwright
          if-no-files-found: ignore

      - name: Stop bootstrap stack
        if: always()
        run: |
          set -euo pipefail

          if [ -d /opt/selflify ]; then
            cd /opt/selflify
            docker compose down -v --remove-orphans || true
          fi

  deploy:
    needs: bootstrap-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: "production"
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          for required in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY AUTH_SECRET; do
            if [ -z "${!required:-}" ]; then
              echo "Missing required GitHub variable/secret: ${required}" >&2
              exit 1
            fi
          done

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add SSH known hosts
        shell: bash
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Prepare remote directory
        shell: bash
        run: |
          set -euo pipefail

          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DEPLOY_PATH}'"

      - name: Remove non-runtime files from remote checkout
        shell: bash
        run: |
          set -euo pipefail

          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${DEPLOY_PATH}"

          rm -rf \
            AGENTS.md \
            APP.md \
            PLAN.md \
            README.md \
            docker-compose.dev.yml \
            docs \
            e2e \
            landing \
            output \
            dist \
            scripts \
            eslint.config.mjs \
            playwright.config.ts \
            playwright.bootstrap.config.ts \
            vitest.config.ts \
            .env.example \
            .nvmrc
          EOF

      - name: Sync repository to server
        shell: bash
        run: |
          set -euo pipefail

          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'coverage/' \
            --exclude '.dev/' \
            --exclude '.selflify/' \
            --exclude 'dist/' \
            --exclude 'output/' \
            --exclude '.env' \
            --exclude 'runtime/' \
            --exclude 'AGENTS.md' \
            --exclude 'APP.md' \
            --exclude 'PLAN.md' \
            --exclude 'README.md' \
            --exclude 'docker-compose.dev.yml' \
            --exclude 'docs/' \
            --exclude 'e2e/' \
            --exclude 'landing/' \
            --exclude 'scripts/' \
            --exclude 'eslint.config.mjs' \
            --exclude 'playwright.config.ts' \
            --exclude 'playwright.bootstrap.config.ts' \
            --exclude 'vitest.config.ts' \
            --exclude '.env.example' \
            --exclude '.nvmrc' \
            -e "ssh -p ${DEPLOY_PORT:-22}" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Upload production env
        shell: bash
        env:
          SELFLIFY_PREVIEW_TTL_DAYS: ${{ vars.SELFLIFY_PREVIEW_TTL_DAYS }}
          SELFLIFY_ORPHAN_TTL_DAYS: ${{ vars.SELFLIFY_ORPHAN_TTL_DAYS }}
          SELFLIFY_CLEANUP_INTERVAL_SECONDS: ${{ vars.SELFLIFY_CLEANUP_INTERVAL_SECONDS }}
          SELFLIFY_BACKUP_KEEP: ${{ vars.SELFLIFY_BACKUP_KEEP }}
        run: |
          set -euo pipefail

          cat <<EOF > .env.production
          AUTH_SECRET=${AUTH_SECRET}
          SELFLIFY_PREVIEW_TTL_DAYS=${SELFLIFY_PREVIEW_TTL_DAYS}
          SELFLIFY_ORPHAN_TTL_DAYS=${SELFLIFY_ORPHAN_TTL_DAYS}
          SELFLIFY_CLEANUP_INTERVAL_SECONDS=${SELFLIFY_CLEANUP_INTERVAL_SECONDS}
          SELFLIFY_BACKUP_KEEP=${SELFLIFY_BACKUP_KEEP}
          EOF

          scp -P "${DEPLOY_PORT:-22}" .env.production "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.env"

      - name: Deploy on server
        shell: bash
        run: |
          set -euo pipefail

          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${DEPLOY_PATH}"

          mkdir -p runtime/data runtime/config runtime/logs

          if [ ! -f runtime/selflify.config.json ]; then
            echo "runtime/selflify.config.json is missing. Bootstrap the server first and complete /setup before using the deploy workflow." >&2
            exit 1
          fi

          if [ ! -f runtime/Caddyfile ]; then
            echo "runtime/Caddyfile is missing. Bootstrap the server first and complete /setup before using the deploy workflow." >&2
            exit 1
          fi

          docker compose pull
          docker compose up -d --remove-orphans
          docker compose ps
          EOF
