services:
  selflify:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: selflify-dev
    command: sh -lc "corepack enable && yarn install && yarn dev --hostname 0.0.0.0 --port 3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-selflify-development-secret-change-me}
      SELFLIFY_CONFIG_PATH: /workspace/selflify.config.json
      SELFLIFY_PREVIEW_ROOT: /workspace/.dev/var-www
      SELFLIFY_CADDY_CONFIG_PATH: /workspace/.dev/Caddyfile
      SELFLIFY_CADDY_BIN: /usr/bin/caddy
      SELFLIFY_CADDY_ADMIN_ADDRESS: http://caddy:2019
      SELFLIFY_MOCK_CLOUDFLARE: "1"
      SELFLIFY_SKIP_CADDY_RELOAD: "1"
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - selflify_node_modules:/workspace/node_modules

  cleanup:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: selflify-dev-cleanup
    command:
      - sh
      - -lc
      - while true; do bash /workspace/cleanup-previews.sh; sleep "${SELFLIFY_CLEANUP_INTERVAL_SECONDS:-3600}"; done
    environment:
      SELFLIFY_CONFIG_PATH: /workspace/selflify.config.json
      SELFLIFY_PREVIEW_TTL_DAYS: ${SELFLIFY_PREVIEW_TTL_DAYS:-30}
      SELFLIFY_ORPHAN_TTL_DAYS: ${SELFLIFY_ORPHAN_TTL_DAYS:-30}
      SELFLIFY_CLEANUP_INTERVAL_SECONDS: ${SELFLIFY_CLEANUP_INTERVAL_SECONDS:-3600}
    volumes:
      - .:/workspace
      - ./.dev/var-www:/var/www

  caddy:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    container_name: selflify-dev-caddy
    depends_on:
      - selflify
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./.dev/Caddyfile:/etc/caddy/Caddyfile
      - ./.dev/caddy-data:/data
      - ./.dev/caddy-config:/config
      - ./.dev/logs:/var/log/caddy
      - ./.dev/var-www:/var/www
    expose:
      - "2019"

volumes:
  selflify_node_modules:
