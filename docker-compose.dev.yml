services:
  selflify:
    build:
      context: .
      dockerfile: docker/selflify/Dockerfile
      target: dev
    container_name: selflify-dev-app
    command:
      - sh
      - -lc
      - node .yarn/releases/yarn-4.13.0.cjs dev:prepare && rm -rf /workspace/.next/* && node .yarn/releases/yarn-4.13.0.cjs install --immutable && node .yarn/releases/yarn-4.13.0.cjs dev --hostname 0.0.0.0 --port 3000
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      SELFLIFY_CONFIG_PATH: /workspace/.dev/selflify.config.json
      SELFLIFY_CADDY_CONFIG_PATH: /workspace/.dev/Caddyfile
      SELFLIFY_CADDY_BIN: /usr/bin/caddy
      SELFLIFY_CADDY_ADMIN_ADDRESS: http://caddy:2019
      SELFLIFY_UPSTREAM: selflify:3000
      SELFLIFY_PREVIEW_ROOT: /var/www
      SELFLIFY_BACKUP_ROOT: /workspace/.selflify/backups
      SELFLIFY_MOCK_CLOUDFLARE: ${SELFLIFY_MOCK_CLOUDFLARE:-1}
      SELFLIFY_SKIP_CADDY_RELOAD: "0"
      SELFLIFY_PREVIEW_TTL_DAYS: ${SELFLIFY_PREVIEW_TTL_DAYS:-30}
      SELFLIFY_ORPHAN_TTL_DAYS: ${SELFLIFY_ORPHAN_TTL_DAYS:-30}
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - selflify_dev_node_modules:/workspace/node_modules
      - selflify_dev_next:/workspace/.next
      - ./.dev/var-www:/var/www

  cleanup:
    build:
      context: .
      dockerfile: docker/selflify/Dockerfile
      target: cleanup
    container_name: selflify-dev-cleanup
    command:
      - sh
      - -lc
      - node .yarn/releases/yarn-4.13.0.cjs dev:prepare && node .yarn/releases/yarn-4.13.0.cjs install --immutable && while true; do node .yarn/releases/yarn-4.13.0.cjs cleanup:run; sleep "${SELFLIFY_CLEANUP_INTERVAL_SECONDS:-3600}"; done
    environment:
      SELFLIFY_CONFIG_PATH: /workspace/.dev/selflify.config.json
      SELFLIFY_PREVIEW_TTL_DAYS: ${SELFLIFY_PREVIEW_TTL_DAYS:-30}
      SELFLIFY_ORPHAN_TTL_DAYS: ${SELFLIFY_ORPHAN_TTL_DAYS:-30}
      SELFLIFY_CLEANUP_INTERVAL_SECONDS: ${SELFLIFY_CLEANUP_INTERVAL_SECONDS:-3600}
    volumes:
      - .:/workspace
      - selflify_cleanup_node_modules:/workspace/node_modules
      - ./.dev/var-www:/var/www

  caddy:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    container_name: selflify-dev-caddy
    depends_on:
      - selflify
    ports:
      - "8080:80"
    command:
      - sh
      - -lc
      - |
        test -f /workspace/.dev/Caddyfile || cp /workspace/.dev/Caddyfile.example /workspace/.dev/Caddyfile
        exec caddy run --config /workspace/.dev/Caddyfile --adapter caddyfile
    volumes:
      - ./.dev:/workspace/.dev
      - ./.dev/caddy-data:/data
      - ./.dev/caddy-config:/config
      - ./.dev/logs:/var/log/caddy
      - ./.dev/var-www:/var/www
    expose:
      - "2019"

volumes:
  selflify_dev_node_modules:
  selflify_dev_next:
  selflify_cleanup_node_modules:
