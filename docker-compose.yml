services:
  selflify:
    build:
      context: .
      dockerfile: docker/selflify/Dockerfile
    container_name: selflify
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      SELFLIFY_CONFIG_PATH: /workspace/runtime/selflify.config.json
      SELFLIFY_CADDY_CONFIG_PATH: /workspace/runtime/Caddyfile
      SELFLIFY_CADDY_BIN: /usr/bin/caddy
      SELFLIFY_CADDY_ADMIN_ADDRESS: http://caddy:2019
    volumes:
      - ./runtime/selflify.config.json:/workspace/runtime/selflify.config.json
      - ./runtime/Caddyfile:/workspace/runtime/Caddyfile
      - /var/www:/var/www
    expose:
      - "3000"

  cleanup:
    build:
      context: .
      dockerfile: docker/selflify/Dockerfile
      target: cleanup
    container_name: selflify-cleanup
    restart: unless-stopped
    depends_on:
      - selflify
    command:
      - sh
      - -lc
      - while true; do yarn cleanup:run; sleep "${SELFLIFY_CLEANUP_INTERVAL_SECONDS:-86400}"; done
    environment:
      SELFLIFY_CONFIG_PATH: /workspace/runtime/selflify.config.json
      SELFLIFY_PREVIEW_TTL_DAYS: ${SELFLIFY_PREVIEW_TTL_DAYS:-30}
      SELFLIFY_ORPHAN_TTL_DAYS: ${SELFLIFY_ORPHAN_TTL_DAYS:-30}
      SELFLIFY_CLEANUP_INTERVAL_SECONDS: ${SELFLIFY_CLEANUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./runtime/selflify.config.json:/workspace/runtime/selflify.config.json
      - /var/www:/var/www

  caddy:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - selflify
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./runtime/Caddyfile:/etc/caddy/Caddyfile
      - ./runtime/data:/data
      - ./runtime/config:/config
      - ./runtime/logs:/var/log/caddy
      - /var/www:/var/www
    expose:
      - "2019"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
